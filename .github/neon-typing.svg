<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="100"
     viewBox="0 0 1000 100">

  <defs>

    <!-- Neon Glow -->
    <filter id="neonGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="3"
                      result="blur1"/>

      <feGaussianBlur stdDeviation="9"
                      result="blur2"/>

      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- Blue Neon Gradient -->
    <linearGradient id="neonBlue"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">

      <stop offset="0%"
            stop-color="#0088ff"/>

      <stop offset="35%"
            stop-color="#00c8ff"/>

      <stop offset="50%"
            stop-color="#ffffff"/>

      <stop offset="65%"
            stop-color="#00c8ff"/>

      <stop offset="100%"
            stop-color="#0088ff"/>

    </linearGradient>

  </defs>


  <!-- ============================= -->
  <!-- SOFTWARE ENGINEERING STUDENT -->
  <!-- ============================= -->

  <text x="500"
        y="62"
        text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-size="38"
        font-weight="800"
        fill="url(#neonBlue)"
        filter="url(#neonGlow)">

    Software Engineering Student.

    <animate
      attributeName="opacity"
      values="1;0.75;1;0.9;1"
      dur="2s"
      repeatCount="indefinite"/>

  </text>


  <!-- ============================= -->
  <!-- FULL-STACK DEVELOPER -->
  <!-- ============================= -->

  <text x="500"
        y="62"
        text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-size="38"
        font-weight="800"
        fill="url(#neonBlue)"
        filter="url(#neonGlow)"
        opacity="0">

    Full-Stack Developer.

    <animate
      attributeName="opacity"
      values="0;0;1;1;1;0;0"
      dur="8s"
      repeatCount="indefinite"/>

  </text>


  <!-- ============================= -->
  <!-- BUILDING SOLUTIONS -->
  <!-- ============================= -->

  <text x="500"
        y="62"
        text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-size="38"
        font-weight="800"
        fill="url(#neonBlue)"
        filter="url(#neonGlow)"
        opacity="0">

    Building Solutions That Matter.

    <animate
      attributeName="opacity"
      values="0;0;0;1;1;1;0"
      dur="8s"
      repeatCount="indefinite"/>

  </text>


  <!-- ============================= -->
  <!-- ALWAYS LEARNING -->
  <!-- ============================= -->

  <text x="500"
        y="62"
        text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-size="38"
        font-weight="800"
        fill="url(#neonBlue)"
        filter="url(#neonGlow)"
        opacity="0">

    Always Learning, Always Building.

    <animate
      attributeName="opacity"
      values="0;0;0;0;1;1;0"
      dur="8s"
      repeatCount="indefinite"/>

  </text>

</svg>
